<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sublime · Explore the cabin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeece6;color:#262c29;font:15px system-ui,sans-serif}header{padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:36px Georgia,serif;margin:0}small{color:#69716b}main{position:relative;height:calc(100vh - 100px);min-height:540px}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:absolute;left:24px;top:20px;width:220px;padding:20px;background:#ffffffed;border-radius:16px;box-shadow:0 10px 40px #26302914}.panel label{display:block;margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:1px}select,button{font:inherit;border:1px solid #d1d6ce;border-radius:8px;padding:10px;background:#fff;color:inherit;width:100%}button{cursor:pointer;margin-top:12px}button.primary{background:#304d40;color:white;border:0}.foot{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(580px,90%);padding:16px 22px;background:#ffffffed;border-radius:14px;box-shadow:0 10px 40px #26302914}input{width:100%;accent-color:#304d40}.caption{margin:0 0 10px;font-weight:500}.hint{position:absolute;right:24px;top:28px;color:#59665e;font-size:13px}#status{position:absolute;left:50%;top:45%;transform:translateX(-50%);background:white;padding:15px;border-radius:10px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4c806a;outline-offset:3px}@media(max-width:650px){header{padding:18px}h1{font-size:28px}.panel{left:12px;top:12px;width:174px;padding:12px}.hint{top:auto;bottom:126px;right:15px}.foot{bottom:15px}main{min-height:620px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
body{min-height:230vh}main{position:sticky;top:0;height:100vh}.shell-note{font-size:12px;color:#69716b;margin-top:12px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><header><div><h1>Sublime</h1><small>A cabin to explore</small></div><small>Illustrative layout · Not to scale</small></header>
<main id="viewer"><div class="panel"><label for="floor">Explore</label><select id="floor"><option value="downstairs">Downstairs</option><option value="upstairs">Upstairs</option><option value="all">Both floors</option></select><label for="room">Room view</label><select id="room"><option value="overview">Front entry overview</option><option value="left">Left king suite</option><option value="right">Right king suite</option><option value="great">Great room & kitchen</option><option value="loft">Open gaming loft</option><option value="bath">Upstairs bathroom</option><option value="bunk">Bunk room</option><option value="deck">Rear deck & hot tub</option></select><button id="exterior">Reveal interior</button><p class="shell-note">Scroll down to enter the cabin</p><button id="wire">Show wireframe</button><button id="tour" class="primary">Play guided tour</button></div><div class="hint">Drag to rotate · Scroll to reveal inside</div><div id="status" role="status">Loading the cabin…</div><div class="foot"><p class="caption" id="caption" aria-live="polite">Front entry overview</p><label for="progress"><small>Guided tour</small></label><input id="progress" type="range" min="0" max="1000" value="0" aria-label="Guided tour position"></div></main>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const host=document.getElementById('viewer'),floor=document.getElementById('floor'),room=document.getElementById('room'),caption=document.getElementById('caption'),progress=document.getElementById('progress'),play=document.getElementById('tour'),wire=document.getElementById('wire'),status=document.getElementById('status');
let shellOpacity=1;let model,playing=false,wireframe=false,last=0,move=null;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eeece6');
const camera=new THREE.PerspectiveCamera(42,1,.05,200);camera.position.set(25,29,34);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,-10);controls.enableDamping=true;controls.enableZoom=false;controls.minDistance=4;controls.maxDistance=80;controls.maxPolarAngle=Math.PI*.48;
scene.add(new THREE.HemisphereLight(0xffffff,0xa1a393,2.5));const sun=new THREE.DirectionalLight(0xffefdc,3.2);sun.position.set(-12,30,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:100});sun.shadow.bias=-.0003;scene.add(sun);scene.add(sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0xe2e0d8,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.95;ground.receiveShadow=true;scene.add(ground);
const views={overview:['downstairs',[25,29,34],[0,1,-10],'Front entry · Two suites and hallways'],left:['downstairs',[-2,10,2],[-5.5,.7,-5],'Left king suite & ensuite'],right:['downstairs',[11,10,2],[5.5,.7,-5],'Right king suite & ensuite'],great:['downstairs',[17,15,-2],[0,1,-18],'Kitchen, dining & great room'],loft:['upstairs',[9,16,10],[-2,5,-4],'Open gaming loft · Overlook toward the great room'],bath:['upstairs',[-1,13,1],[-5.6,5.4,-6.5],'Enclosed upstairs bathroom'],bunk:['upstairs',[14,13,3],[5.5,5.3,-4],'Four bunks · Opposing north and south walls'],deck:['downstairs',[20,16,-38],[0,1,-26],'Rear deck & hot tub']};
function shell(value){shellOpacity=value;if(!model)return;model.traverse(o=>{if(o.userData.shell){o.visible=value>.005;o.castShadow=value>.8;for(const m of Array.isArray(o.material)?o.material:[o.material]){m.transparent=value<1;m.opacity=value;m.depthWrite=value>.95;}}});document.getElementById('exterior').textContent=value>.5?'Reveal interior':'Show exterior';}
window.addEventListener('scroll',()=>{if(!model)return;stop();move=null;const t=Math.min(1,window.scrollY/(innerHeight*.8));shell(1-t);floor.value='downstairs';visibility();camera.position.set(25-8*t,22+7*t,34-10*t);controls.target.set(0,2-t,-10-3*t);caption.textContent=t<.05?'Exterior · Scroll to step inside':t<1?'Entering Sublime · Exterior fading away':'Downstairs · Explore the rooms';});
document.getElementById('exterior').onclick=()=>{shell(shellOpacity>.5?0:1);visibility();};
function visibility(){if(!model)return;model.traverse(o=>{if(o.userData.shell)o.visible=shellOpacity>.005;else if(o.userData.floor)o.visible=floor.value==='all'||o.userData.floor===floor.value;});}
function stop(){playing=false;play.textContent='Play guided tour';}
function view(key,animate=true){const v=views[key];shell(0);floor.value=v[0];visibility();caption.textContent=v[3];if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)move={start:performance.now(),p:camera.position.clone(),t:controls.target.clone(),end:new THREE.Vector3(...v[1]),target:new THREE.Vector3(...v[2])};else{camera.position.set(...v[1]);controls.target.set(...v[2]);controls.update();}}
const stops=['overview','left','right','great','loft','bunk','deck','overview'];
function tourAt(value){shell(0);const n=value*(stops.length-1),i=Math.min(stops.length-2,Math.floor(n)),u=n-i,a=views[stops[i]],b=views[stops[i+1]],k=u*u*(3-2*u);floor.value=u<.5?a[0]:b[0];visibility();camera.position.fromArray(a[1]).lerp(new THREE.Vector3(...b[1]),k);controls.target.fromArray(a[2]).lerp(new THREE.Vector3(...b[2]),k);caption.textContent=u<.5?a[3]:b[3];room.value=u<.5?stops[i]:stops[i+1];controls.update();}
room.onchange=()=>{stop();view(room.value);};floor.onchange=()=>{stop();visibility();if(floor.value==='upstairs'){view('loft');room.value='loft';}else if(floor.value==='downstairs'){view('overview');room.value='overview';}else{caption.textContent='Both floors · Rotate to explore';}};
wire.onclick=()=>{wireframe=!wireframe;model?.traverse(o=>{if(o.isMesh){for(const m of Array.isArray(o.material)?o.material:[o.material])m.wireframe=wireframe;}});wire.textContent=wireframe?'Show solid surfaces':'Show wireframe';wire.setAttribute('aria-pressed',String(wireframe));};
play.onclick=()=>{if(playing)stop();else{move=null;playing=true;play.textContent='Pause tour';if(+progress.value>=1000)progress.value=0;}};progress.oninput=()=>{stop();move=null;tourAt(+progress.value/1000);};controls.addEventListener('start',()=>{stop();move=null;});
new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}).observe(host);
try{new GLTFLoader().load('./cabin.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.userData.shell)o.material=o.material.clone();}});scene.add(model);status.hidden=true;view('overview',false);shell(1);visibility();camera.position.set(25,22,34);controls.target.set(0,2,-10);caption.textContent='Exterior · Scroll to step inside';},undefined,e=>{status.textContent='Unable to load the cabin model. Please refresh or return to the photos.';console.error(e);});}catch(e){status.textContent='Unable to initialize the 3D viewer.';console.error(e);}
renderer.setAnimationLoop(time=>{const dt=Math.min((time-last)/1000,.1);last=time;if(playing&&model){progress.value=Math.min(1000,+progress.value+dt*25);tourAt(+progress.value/1000);if(+progress.value>=1000)stop();}else if(move){let u=Math.min(1,(time-move.start)/900);u=u*u*(3-2*u);camera.position.copy(move.p).lerp(move.end,u);controls.target.copy(move.t).lerp(move.target,u);if(u>=1)move=null;}controls.update();renderer.render(scene,camera);});
</script></body></html>
